{{ define "main" }}
<content>
  <!--temporary display the writing in index.md-->
  <h1>{{ .Title }}</h1>

  {{ if .Content }}
    <div class="page-content">
      {{ .Content }}
    </div>
  {{ end }}


  <ul class="blog-posts">
    {{ range .Pages }}
    <li>
      <span>
        <i>
          <time datetime='{{ .Date.Format "2006-01-02" }}'> <!--a formatting template-->
            {{ .Date.Format (default "02 Jan, 2006" .Site.Params.dateFormat) }}
          </time>
        </i>
      </span>
      <a href="{{ .Permalink }}">{{ .Title }}</a>
    </li>
    {{ else }}
    <li>
      No posts yet
    </li>
    {{ end }}
  </ul>
</content>
{{ end }}
