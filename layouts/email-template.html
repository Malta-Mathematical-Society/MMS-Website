<!DOCTYPE html>
<html>
<head>
    <style>
        body { font-family: sans-serif; color: #333; line-height: 1.6; }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; }
        .button { background: #0070f3; color: #fff; padding: 12px 20px; text-decoration: none; border-radius: 5px; display: inline-block; }
        .lang-divider { border-top: 1px solid #ccc; margin: 25px 0; }
    </style>
</head>
<body>
    <div class="container">
        <!-- Maltese Section -->
        <h2>Post Ġdid: {{ .Title }}</h2>
        <p>{{ .Summary }}</p>
        <p><a href="{{ .Permalink.Ur }}" class="button">Aqra Aktar Fuq Il-Sit</a></p>

        <div class="lang-divider"></div>

        <!-- English Section -->
        <h2>{{ .Title }}</h2>
        <p>{{ .Summary }}</p>
        <p><a href="{{ .Permalink }}" class="button">Read Full Post</a></p>
    </div>
</body>
</html>
