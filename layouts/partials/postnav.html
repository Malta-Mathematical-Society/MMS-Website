{{ $comics := (where .Site.RegularPages "Type" "comics").ByDate }}
{{ $first := index $comics 0}}
{{ $latest := index $comics.Reverse 0}}

<nav class="comic-nav">
  <!-- First Comic -->
  <a href="{{ $first.RelPermalink }}" {{ if eq . $first }}class="disabled"{{ end }}>|&lt;</a>
  
  <!-- Previous Comic (Older) -->
  {{ with .PrevInSection }}
    <a href="{{ .RelPermalink }}">&lt; Prev</a>
  {{ else }}
    <span class="disabled">&lt; Prev</span>
  {{ end }}

  <!-- Random Comic (Client-Side JS) -->
  <a href="#" onclick="const pages=[{{ range $comics }}'{{ .RelPermalink }}',{{ end }}]; location.href=pages[Math.floor(Math.random()*pages.length)]; return false;">Random</a>
  <!-- Next Comic (Newer) -->
  
  {{ with .NextInSection }}
    <a href="{{ .RelPermalink }}">Next &gt;</a>
  {{ else }}
    <span class="disabled">Next &gt;</span>
  {{ end }}

  <!-- Latest Comic -->
  <a href="{{ $latest.RelPermalink }}" class="{{ if eq $.Permalink $latest.Permalink }}disabled{{ end }}">&gt;&vert;</a>
</nav>
