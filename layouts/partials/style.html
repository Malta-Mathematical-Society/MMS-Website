<style>
  /* ==========================================================================
   1. VARIABLES, RESETS & BASE LAYOUT
   ========================================================================== */
/*import Lato, the font of our logo*/
  @import url('https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,400;0,700;1,400&display=swap');
  
  :root {
    --width: 100%;
    --font-main: 'Lato', sans-serif;
    --font-secondary: 'Lato', sans-serif;
    --font-scale: 1.25rem;

    /*MMS brand colors*/
    --background-color: #7aaafa;
    --heading-color: #000000;
    --text-color: #000000;
    --link-color: #971C13;
    --visited-color: #1a1397;
    --blockquote-color: #000000;

    --header-bg: #F6CA50;        /* Yellow header stripe */
    --stripe-bg: #000000;     /* White divider line */
    --footer-bg: #0471cc;        /* Red footer stripe */
    --node-diameter: 30px;
  }

  /* Global Box Sizing Reset */
  *, *::before, *::after {
    box-sizing: border-box;
  }

  body {
    font-family: var(--font-secondary);
    font-size: var(--font-scale);
    line-height: 1.6;        /* Gives mathematical prose plenty of breathing room */
    color: #111116;          /* Deep ink black instead of harsh #000 */
    -webkit-font-smoothing: antialiased; /* Renders vector font curves ultra-smooth */
    text-align: left;
    margin: 0;
    background-color: var(--background-color);
  }

  main {
    padding: 0 1.5rem;
    margin: auto;
    max-width: 650px;
    border: 2px solid var(--heading-color, #000000);
    position: relative;
  }

    main::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    width: var(--node-diameter);
    height: var(--node-diameter);
    background-color: #FFFFFF;
    border: 2px solid #000000;
    border-radius: 50%;
    transform: translate(-50%, -50%); /* Centers node over top-left corner */
    z-index: 5;
  }

  main::after {
    content: "";
    position: absolute;
    top: 0;
    right: 0;
    width: var(--node-diameter);
    height: var(--node-diameter);
    background-color: #FFFFFF;
    border: 2px solid #000000;
    border-radius: 50%;
    transform: translate(50%, -50%); /* Centers node over top-right corner */
    z-index: 5;
  }

/* 3. BOTTOM-LEFT CORNER NODE */
  main > *:last-child::before {
    content: "";
    position: absolute;
    bottom: 0;
    left: 0;
    width: var(--node-diameter);
    height: var(--node-diameter);
    background-color: #FFFFFF;
    border: 2px solid #000000;
    border-radius: 50%;
    transform: translate(-50%, 50%);
    z-index: 5;
  }

/* 4. BOTTOM-RIGHT CORNER NODE */
  main > *:last-child::after {
    content: "";
    position: absolute;
    bottom: 0;; /* Matches main's bottom padding offset */
    right: 0;  /* Matches main's right padding offset */
    width: var(--node-diameter);
    height: var(--node-diameter);
    background-color: #FFFFFF;
    border: 2px solid #000000;
    border-radius: 50%;
    transform: translate(50%, 50%);
    z-index: 5;
  }

  img {
    max-width: 100%;
    height: auto;
    display: block;
  }

/* ==========================================================================
   2. TYPOGRAHY & BASE HTML ELEMENTS
   ========================================================================== */
  h1,h2,h3,h4,h5,h6,ul,ol{
    font-family: var(--font-main);
    color: var(--heading-color);
    margin-top: 0.5rem;
    margin-bottom: 0.5rem;
  }

  p {
    font-family: var(--font-secondary)
  }

  h1,h2 {
  text-transform: uppercase;
}
  h1 {
    margin: 1rem 0;
  }

  a {
    color: var(--link-color);
    cursor: pointer;
    text-decoration: none;
  }

  a:hover {
    color: var(--visited-color);
  }

  strong,
  b {
    color: var(--heading-color);
  }

  button {
    margin: 0;
    cursor: pointer;
  }

  time {
    font-family: monospace;
    font-style: normal;
    font-size: 15px;
  }

  table {
    width: 100%;
  }

  hr {
    border: 0;
    border-top: 1px dashed;
  }

  code {
    font-family: monospace;
    padding: 2px;
    border-radius: 3px;
  }

  blockquote {
    border-left: 1px solid #999;
    color: var(--blockquote-color);
    padding-left: 20px;
    font-style: italic;
  }


/* ==========================================================================
   3. HEADER & NAVIGATION
   ========================================================================== */
  .header-stripe {
    display:flex;
    flex-wrap: nowrap;
    justify-content: space-between; /*the x-axis*/
    align-items: center; /*the y-axis center*/
    background-color: var(--header-bg);
    padding: 10px 20px;
    gap: 1.5rem;
    width: 100%;
    margin: auto;
  }

@media (max-width: 700px) {     /* Set this to the exact width where items get close */
  .header-stripe {
    flex-direction: column;
    align-items: stretch;
    gap: 0.75rem;
  }

  /* Row 1: Spreads Logo to left wall and Language Switch to right wall */
  .header-left {
    justify-content: space-between;
    width: 100%;
  }

  /* Row 2: Takes up the entire width on its own line below */
  .site-nav {
    justify-content: space-between; /* Distributes links evenly across the line */
    position: relative;
    display: inline-block;
  }
}

.header-left {
  display: flex;
  align-items: center;
  gap: 1rem;                      /* Space between logo and language toggle */
  flex: 0 0 auto;
}

.site-logo {
  height: 64px;
  width: auto;
  display: block;
  margin: 0 0.5rem;
}

.site-nav{
  display: flex;
  align-items: center;
  flex: 0 0 auto;
  gap: 1rem;
  margin-left: auto; /* Hugs the right wall on wide screens */
}

.site-nav a {
  color: var(--link-color);
  font-weight: 700;
  text-decoration: none;
  white-space: nowrap;
}

.site-nav a:hover {
    color: var(--visited-color);
}

/* Dropdown Container */
/* Keep the site-nav aligned horizontally */
.site-nav {
  display: flex;
  align-items: center;
  gap: 1rem;
}

/* Treat the dropdown container as part of the inline text flow */
.dropdown {
  position: relative;
  display: inline-flex;
  align-items: center;
}

/* Style the archive button to look like any other text link */
.dropdown-title {
  background: none;
  border: none;
  font: inherit;
  font-weight: 700;
  color: var(--link-color);
  padding: 0;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 0.25rem;
}

.dropdown-title:hover {
  color: var(--visited-color);
}

/* 1 & 2. Arrow on the LEFT, using the long character ＞ */
.dropdown-title::before {
  content: "＞";
  display: inline-block;
  font-weight: normal;
}

/* Clear any accidental pseudo-elements on the right */
.dropdown-title::after {
  content: none;
  display: none; /* Hidden by default */
}

/* When the dropdown is open, make the colon appear right after "Archive" */
.dropdown:focus-within .dropdown-title::after {
  content: ":";
  display: inline;
}

/* 3. The 3 categories are hidden by default */
.dropdown-content {
  display: none;
}

/* 4. When focused/clicked, append them directly to the RIGHT as text items */
.dropdown:focus-within .dropdown-content {
  display: inline-flex;
  align-items: center;
  gap: 0.75rem; /* Space between the appended category links */
  margin-left: 0.75rem; /* Space between "Archive" and the first category */
}

/* Style the appended items to look like clean, unboxed text links */
.dropdown-content a {
  color: var(--link-color);
  font-weight: 700;
  text-decoration: none;
}

.dropdown-content a:hover {
  color: var(--visited-color);
}

/* Optional separator slash/bullet between the appended items if you want them distinct */
.dropdown-content a + a::before {
  content: "/";
  margin-right: 0.75rem;
  color: var(--text-color);
  font-weight: normal;
}
/* ==========================================================================
   4. LANGUAGE SWITCHER TOGGLE
   ========================================================================== */

.lang-switch {
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
  background: none;
  padding-left: 0.5rem;
  border-radius: 0;
}

/* Style the language links */
.lang-switch a {
  display: inline;
  padding: 0;
  font-weight: 700;
  color: var(--link-color);
}

.lang-switch a:hover {
  color: var(--visited-color);
}

/* Active language formatting */
.lang-switch a.active {
  color: var(--heading-color);
}

/* Separate the language options cleanly with a slash */
.lang-switch a + a::before {
  content: "/";
  margin-right: 5px;
  color: var(--text-color);
  font-weight: 700;
}

/* ==========================================================================
   5. PAGE-SPECIFIC COMPONENTS
   ========================================================================== */


  .title:hover {
    text-decoration: none;
  }

  .title h1 {
    font-size: 1.5em;
  }

  .inline {
    width: auto !important;
  }

  .highlight,
  .code {
    border-radius: 3px;
    margin-block-start: 1em;
    margin-block-end: 1em;
    overflow-x: auto;
  }

  .highlight pre,
  .code pre {
    min-width: 100%;
    width: max-content;
  }

  /* blog post list */
  ul.blog-posts {
    list-style-type: none;
    padding: unset;
  }

  ul.blog-posts li {
    display: flex;
  }

  ul.blog-posts li span {
    flex: 0 0 130px;
  }

  ul.blog-posts li a:visited {
    color: var(--visited-color);
  }


  /*MAILING-LIST PAGE STYLING*/
  .checkbox-label {
    display: flex;        /* Takes up the full width, forcing a new line */
    align-items: center;  /* Vertically aligns the checkbox square with the text */
    gap: 0.5rem;          /* Adds space between the checkbox box and label text */
    cursor: pointer;
  }

/* ==========================================================================
   6. MOBILE RESPONSIVE ADJUSTMENTS
   ========================================================================== */
@media (max-width: 600px) {
  .header-stripe {
    flex-direction: column;
    align-items: flex-start;
    gap: 0.75rem;
    padding: 0.75rem 1rem;
  }

  .site-nav {
    margin-left: 0;               /* Resets right-align so it stacks naturally */
  }

  ul.blog-posts li {
    flex-direction: column;
    margin-bottom: 1rem;
  }

  ul.blog-posts li span {
    flex: none;
    font-size: 0.85em;
    opacity: 0.85;
  }
}
/* ==========================================================================
   6. MAIN PAGE
   ========================================================================== */
  .home-grid {
    display: grid;
    grid-template-columns: 1fr;
    margin-left: -1.5rem;
    margin-right: -1.5rem;
    width: calc(100% + 3rem);
  }

  .home-grid h2 {
    padding-left: 0.5rem;
  }

  /* Horizontal Divider (if used elsewhere) */
  .p-divider-x {
    background-color: #000000;
    width: 2px;
    height: 100%;
    position: relative;
  }

  /* Vertical Hairline / Horizontal Divider for Stacked Layout */
  .p-divider-y {
    background-color: #000000;
    width: 100%;
    height: 2px;
    position: relative;
  }

 .home-grid {
    display: grid;
    grid-template-columns: 1fr;
    width: calc(100% + 3rem);
  }

  .home-grid h2 {
    padding-left: 0.5rem;
  }

  /* Horizontal Divider (if used elsewhere) */
  .p-divider-x {
    background-color: #000000;
    width: 2px;
    height: 100%;
    position: relative;
  }

  /* Vertical Hairline / Horizontal Divider for Stacked Layout */
  .p-divider-y {
    background-color: #000000;
    width: 100%;
    height: 2px;
    position: relative;
  }

  /* Base style for both end circles */
  .p-divider-y::before,
  .p-divider-y::after {
    content: "";
    position: absolute;
    width: var(--node-diameter);
    height: var(--node-diameter);
    background-color: #ffffff;
    border: 2px solid #000000;
    border-radius: 50%;
    margin-left:-1px;
    margin-right:-1px;
    z-index: 2;
  }

  /* Horizontal alignment of circles for the stacked layout */
  .p-divider-y::before {
    left: 0;
    top: 50%;
    transform: translate(-50%, -50%);
  }

  .p-divider-y::after {
    right: 0;
    top: 50%;
    transform: translate(50%, -50%);
  }


  /* Horizontal alignment of circles for the stacked layout */
  .p-divider-y::before {
    left: 0;
    top: 50%;
    transform: translate(-50%, -50%);
  }

  .p-divider-y::after {
    right: 0;
    top: 50%;
    transform: translate(50%, -50%);
  }

/* ==========================================================================
   7. COMIC VIEWER
   ========================================================================== */

.comic-nav {
  display: flex;
  justify-content: center;
  gap: 0.5rem; /* Space between buttons side-by-side */
  font-variant: small-caps;  /* EDIT THESE VALUES to control space above and below nav bars: */
  margin-top: 1rem;    /* <-- Space ABOVE the nav bar */
  margin-bottom: 1rem; /* <-- Space BELOW the nav bar */
}

.comic-nav a,
.comic-nav .disabled {
  font-family: var(--font-secondary);
  background-color: #0072ce;
  /* Clean white button text */
  color: #ffffff;
  /* Subtle border outline for button structure */
  border: 0px solid #000000;
  /* Very tight padding gives xkcd's signature compact button dimensions */
  padding: 0.2rem 0.65rem;
  border-radius: 6px;
  font-size: 0.85rem;
  font-weight: bold;
  text-decoration: none;
  display: inline-block;
  cursor: pointer;
  line-height: 1.2;
  white-space: nowrap; /*no squish*/
  flex-shrink: 0;/*no squish*/
}

/* press button */
.comic-nav a:active {
  filter: brightness(0.8);
}

/* 4. Disabled button state (First/Prev on page 1, Next/Latest on latest page) */
.comic-nav .disabled {
  /* Fades out disabled buttons while preserving button box shape */
  opacity: 0.33;
  pointer-events: none;
}

.comic-transcript {
  padding: 0rem 2rem 1rem;
  max-width: 100%;
  box-sizing: border-box;
}

.full-comic-reader{
  max-width: 640px;
  margin: 0 auto;
  padding: 0;
}

/* If the main tag contains the comic reader, override the 3rem margin and center it */
main:has(.full-comic-reader) {
  margin: 0 auto;
  padding: 0; 
}

/* 1. Hide default triangle */
.comic-transcript summary {
  min-width: 0;
  font-family: inherit;
  list-style: none;
  cursor: pointer;
  display: flex;
  align-items: center;
  display: inline-block;
  overflow-wrap: anywhere;
}

.comic-transcript summary::-webkit-details-marker {
  display: none; /* remove auto trianlge */
}

pre,
.transcript pre {
  max-width: 100%;
  overflow-wrap: anywhere;
  white-space: pre-wrap;  /* Preserves linebreaks but wraps at container boundary */
}

/*  Add custom arrow */
.comic-transcript summary::before {
  content: "＞";
  display: inline-block;
}


/* 3. Spin on open */
.comic-transcript[open] summary::before {
  transform: rotate(90deg);
}

.comic-transcript summary:hover {
  color: var(--link-color);
}
/* ==========================================================================
   8. EVENT
   ========================================================================== */

/* Side-by-side grid container */
.event-page-container {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 3rem;
  align-items: start;
}

/* Stack nicely on mobile screens */
@media (max-width: 768px) {
  .event-page-container {
    grid-template-columns: 1fr;
    gap: 2rem;
  }
}
/* ==========================================================================
   8. FOOTER
   ========================================================================== */

footer {
  background: var(--footer-bg);
  text-align: center;
  font-size: 1rem;
  padding: 10px;
}

footer p {
  margin: 0;
  color: #000000;
}

footer a {
  color: inherit;
  text-decoration: underline;
}

footer a:hover {
  color: #ffffff;
}

</style>
