<style>
  /* ==========================================================================
   1. VARIABLES, RESETS & BASE LAYOUT
   ========================================================================== */
/*import Lato, the font of our logo*/
  @import url('https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap');
  
  :root {
    --width: 800px;
    --font-main: "Roboto", "Lato", Verdana, sans-serif;
    --font-secondary: "Roboto", "Lato", sans-serif;
    --font-scale: 1.25rem;
    --background-color: #7aaafa;
    --heading-color: #000000;
    --text-color: #000000;
    --link-color: #1a1397;
    --visited-color: #971C13;
    --blockquote-color: #000000;
    --header-bg: #F6CA50;        /* Yellow header stripe */
    --stripe-bg: #000000;     /* White divider line */
    --footer-bg: #ab362e;        /* Red footer stripe */
    --node-diameter: 30px;
  }

  /* Global Box Sizing Reset */
  *, *::before, *::after {
    box-sizing: border-box;
  }

  body {
    font-family: var(--font-secondary);
    font-size: var(--font-scale);
    line-height: 1.6;        /* Gives mathematical prose plenty of breathing room */
    color: #111116;          /* Deep ink black instead of harsh #000 */
    -webkit-font-smoothing: antialiased; /* Renders vector font curves ultra-smooth */
    text-align: left;
    margin: 0;
    background-color: var(--background-color);
    max-width: 100%;
    overflow-x: hidden;
  }

  main {
    max-width: var(--width);
    padding: 1.5rem 1.5rem 1.5rem;
    margin: auto;
    border: 2px solid #000000;
    position: relative;
  }

    main::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    width: var(--node-diameter);
    height: var(--node-diameter);
    background-color: #FFFFFF;
    border: 2px solid #000000;
    border-radius: 50%;
    transform: translate(-50%, -50%); /* Centers node over top-left corner */
    z-index: 5;
  }

  main::after {
    content: "";
    position: absolute;
    top: 0;
    right: 0;
    width: var(--node-diameter);
    height: var(--node-diameter);
    background-color: #FFFFFF;
    border: 2px solid #000000;
    border-radius: 50%;
    transform: translate(50%, -50%); /* Centers node over top-right corner */
    z-index: 5;
  }

/* 3. BOTTOM-LEFT CORNER NODE */
  main > *:last-child::before {
    content: "";
    position: absolute;
    bottom: 0;
    left: 0;
    width: var(--node-diameter);
    height: var(--node-diameter);
    background-color: #FFFFFF;
    border: 2px solid #000000;
    border-radius: 50%;
    transform: translate(-50%, 50%);
    z-index: 5;
  }

/* 4. BOTTOM-RIGHT CORNER NODE */
  main > *:last-child::after {
    content: "";
    position: absolute;
    bottom: 0;; /* Matches main's bottom padding offset */
    right: 0;  /* Matches main's right padding offset */
    width: var(--node-diameter);
    height: var(--node-diameter);
    background-color: #FFFFFF;
    border: 2px solid #000000;
    border-radius: 50%;
    transform: translate(50%, 50%);
    z-index: 5;
  }

  img {
    max-height: 80vh;
    width: auto;
    max-width: 100%;
    object-fit: contain;
    display: block;
    margin: 0 auto; /*center*/
  }

/* ==========================================================================
   2. TYPOGRAHY & BASE HTML ELEMENTS
   ========================================================================== */
  h1,h2,h3,h4,h5,h6,ul,ol{
    font-family: var(--font-main);
    color: var(--heading-color);
  }

  ul {
    list-style-type: ">";
  }

  h1,h2 {
  text-transform: uppercase;
}


  a {
    color: var(--link-color);
    cursor: pointer;
    text-decoration: underline;
  }

  a:hover {
    color: var(--visited-color);
  }

  strong,
  b {
    color: var(--heading-color);
  }

  button {
    margin: 0;
    cursor: pointer;
  }

  time {
    font-family: monospace;
    font-style: normal;
    font-size: 15px;
  }



  table {
    width: 100%;
  }

  hr {
    border: 0;
    border-top: 1px dashed;
  }

  code {
    font-family: monospace;
    padding: 2px;
    border-radius: 3px;
  }

  blockquote {
    border-left: 1px solid #999;
    color: var(--blockquote-color);
    padding-left: 20px;
    font-style: italic;
  }


/* ==========================================================================
   3. HEADER & NAVIGATION
   ========================================================================== */
  .header-stripe {
    /*look*/
    background-color: var(--header-bg);
    padding: 10px 30px 10px 15px;
    width: 100%;

    
    /*flexbox settings*/
    display:flex;
    flex-direction: row;
    flex-wrap: wrap; /*make items wrap rather than overflow*/
    align-items: center; /*the y-axis center*/
    gap: 1rem;
    justify-content: space-between;
  }

  .site-nav{
    /*flexbox settings*/
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 1rem;
    justify-content: center;
  }

  .site-nav a {
    font-weight: 700;
    white-space: nowrap;
    justify-content: center;
  }

  .site-nav a:hover {
      color: var(--visited-color);
  }

  .header-left {
    /*look*/
    /*flexbox settings*/
    display: flex;
    align-items: center; /* y-axis alignment */
    gap: 1rem; /* Space between logo and language toggle */
    flex: 0 0 auto;
  }

  .site-logo {
    height: 64px;
    width: auto;
    display: block;
  }

  /* ==========================================================================
    4. LANGUAGE SWITCHER TOGGLE
    ========================================================================== */

  .lang-switch {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    background: none;
    padding-left: 0.5rem;
    border-radius: 0;
  }

  /* Style the language links */
  .lang-switch a {
    display: inline;
    padding: 0;
    font-weight: 700;
    color: var(--visited-color);
    text-decoration: none;
    white-space: nowrap;

  }

  .lang-switch a:hover {
    color: var(--link-color);
  }

  /* Active language formatting */
  .lang-switch a.active {
    color: var(--heading-color);
  }

  /* Separate the language options cleanly with a slash */
  .lang-switch a + a::before {
    content: "/";
    margin-right: 5px;
    color: var(--text-color);
    font-weight: 700;
  }

/* ==========================================================================
   5. PAGE-SPECIFIC COMPONENTS
   ========================================================================== */

  .title:hover {
    text-decoration: none;
  }

  .title h1 {
    font-size: 1.5em;
  }

  .inline {
    width: auto !important;
  }

  .highlight,
  .code {
    border-radius: 3px;
    margin-block-start: 1em;
    margin-block-end: 1em;
    overflow-x: auto;
  }

  .highlight pre,
  .code pre {
    min-width: 100%;
    width: max-content;
  }

  /* blog post list */
  ul.blog-posts {
    list-style-type: none;
    padding: unset;
  }

  ul.blog-posts li {
    display: flex;
  }

  ul.blog-posts li span {
    flex: 0 0 130px;
  }

  ul.blog-posts li a:visited {
    color: var(--visited-color);
  }


  /*MAILING-LIST PAGE STYLING*/
  .checkbox-label {
    display: flex;        /* Takes up the full width, forcing a new line */
    align-items: center;  /* Vertically aligns the checkbox square with the text */
    gap: 0.5rem;          /* Adds space between the checkbox box and label text */
    cursor: pointer;
  }

  /* Container created by row shortcode */
  .img-row {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    margin: 1.5em 0;
  }

  /* Ensure paragraph tags inside the row don't break flex layout */
  .img-row p {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    width: 100%;
    margin: 0;
  }

  /* Force exactly 2 images per line */
  .img-row img,
  .img-row p img {
    width: calc(50% - 6px); /* 50% minus half of the 12px gap */
    height: auto;
    object-fit: cover;
    margin: 0;
  }

  .img-row img:only-child,   /* If there is only 1 image inside the row, let it take full width */
  .img-row p img:only-child {
    width: 100%;
  }

  @media (max-width: 600px) {  /* Mobile responsiveness: stack vertically on narrow screens */
    .img-row img,
    .img-row p img {
      width: 100%;
    }
  }
/* ==========================================================================
   6. MOBILE RESPONSIVE ADJUSTMENTS
   ========================================================================== */
  @media (max-width: 600px) {
    .header-stripe {
      flex-direction: column;
      align-items: flex-start;
      gap: 0.75rem;
      padding: 0.75rem 1rem;
    }

    .site-nav {
      margin-left: 0;               /* Resets right-align so it stacks naturally */
    }

    ul.blog-posts li {
      flex-direction: column;
      margin-bottom: 1rem;
    }

    ul.blog-posts li span {
      flex: none;
      font-size: 0.85em;
      opacity: 0.85;
    }
  }
/* ==========================================================================
   6. HOME PAGE
   ========================================================================== */
/* Target main ONLY on the index page where .home-grid exists */
  main:has(.home-grid) {
    /* 1. Reset standard layout box & borders */
    max-width: 100% !important;
    width: 100% !important;
    border: none !important;
    padding: 0 !important;
    margin: 0 !important;
    position: relative;
    
    /* 2. Turn main into the horizontal side-scroll track */
    overflow-x: auto;
    overflow-y: hidden;
    white-space: nowrap;
    
    /* 3. Smooth momentum scrolling & snap behavior */
    scroll-snap-type: x mandatory;
    -webkit-overflow-scrolling: touch;
  }

  /* 4. Remove corner circle nodes on index page only */
  main:has(.home-grid)::before,
  main:has(.home-grid)::after,
  main:has(.home-grid) > *:last-child::before,
  main:has(.home-grid) > *:last-child::after {
    display: none !important;
    content: none !important;
  }

  .home-grid ul, p {
    padding: 0;
    margin: 0;
  }

  .home-grid {
  display: flex !important;
  flex-direction: row !important; /*text allighned with image*/
  width: max-content !important;
  }

  .home-grid h3 {
    font-weight: normal;
    font-style: italic;
    margin-top: 0;
  } 

  .home-grid img {  
    /* 1. Prevent vertical squishing on short screens */
    min-height: 300px !important; /* Set your desired minimum height floor */
    
    /* 2. Prevent excessive growth on ultra-tall screens */
    max-height: 700px !important;
    width: 100% !important;
    max-width: 100% !important;
  }
  
  @media screen and (max-width: 768px) {
    /* Flip layout from horizontal row back to vertical column stack */
    .home-grid {
      flex-direction: column !important;
      width: 100% !important;
    }
  }


/* ==========================================================================
   7. COMIC VIEWER
   ========================================================================== */
  .comic-nav {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 1.5rem; /* Spacious text-based separation */
    margin-top: 1.5rem;
    margin-bottom: 1.5rem;
    font-family: var(--font-secondary);
    font-weight: 700;
  }

  /* Treat navigation items like normal text links */
  .comic-nav a {
    color: var(--visited-color);
    text-decoration: none;
    background: none;
    border: none;
    padding: 0;
    box-shadow: none;
  }

  .comic-nav a:hover {
    color: var(--link-color);
  }

  /* Disabled state (e.g., on the first or last page of the comic) */
  .comic-nav .disabled {
    color: var(--text-color);
    opacity: 0.3;
    pointer-events: none;
    text-decoration: none;
  }

  .comic-transcript {
    padding: 0rem 2rem 1rem;
    max-width: 100%;
    box-sizing: border-box;
    font-size: 1rem;
    font-family: monospace
  }

  /* 1. Hide default triangle */
  .comic-transcript summary {
    min-width: 0;
    font-family: inherit;
    font-size: 1rem;
    list-style: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    display: inline-block;
    margin:
  }

  .comic-transcript summary::-webkit-details-marker {
    display: none; /* remove auto trianlge */
  }

  pre,
  .transcript pre {
    max-width: 100%;
    overflow-wrap: anywhere;
    white-space: pre-wrap;  /* Preserves linebreaks but wraps at container boundary */
  }

  /*  Add custom arrow */
  .comic-transcript summary::before {
    content: "＞";
    display: inline-block;
  }


  /* 3. Spin on open */
  .comic-transcript[open] summary::before {
    transform: rotate(90deg);
  }

  .comic-transcript summary:hover {
    color: var(--link-color);
  }

/* ==========================================================================
   8. FOOTER
   ========================================================================== */

  footer {
    background: var(--footer-bg);
    text-align: center;
    padding: 10px;
  }

  footer a {
    color: inherit;
  }

  footer a:hover {
    color: #ffffff;
  }

/* ==========================================================================
   9. MEMBERSHIP FORM
   ========================================================================== */

}
