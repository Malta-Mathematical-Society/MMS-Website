<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        /* 1. Layout & Theme Settings */
        body { background-color: #f4f6f8; font-family: system-ui, sans-serif; margin: 0; padding: 20px; }
        .card { max-width: 600px; margin: 0 auto; background: #ffffff; padding: 30px; border-radius: 8px; }
        
        /* 2. Styling Hugo Content */
        .content { color: #333333; font-size: 16px; line-height: 1.6; }
        .content a { color: #2563eb; }
        
        /* Humble Red Hyperlink CTA */
        .cta-wrapper { text-align: left; margin: 28px 0 16px 0; }
        .red-link { 
            color: #dc2626 !important; 
            font-weight: 700; 
            text-decoration: underline !important; 
            font-size: 16px;
        }
        
        /* 4. Footer Styling */
        .footer { 
            margin-top: 30px;
            font-size: 12px;
            color: #777777;
            text-align: center; }
    </style>
</head>
<body>
    <div class="card">
        <!-- ORDER OF DISPLAY -->
        <h2>{{ TITLE }}</h2>
        
        <div class="content">
            {{ CONTENT }}
        </div>

        <div style="margin-top: 24px; text-align: left;">
            <a href="{{ PERMALINK }}" style="color: #dc2626; font-weight: bold; text-decoration: underline;">{{ LINK_TEXT }};</a>
        </div>

        <div style="margin-top: 32px; border-top: 1px solid #eeeeee; padding-top: 16px; font-size: 12px; color: #777777; text-align: center;">
            <p>{{ COPYRIGHT_TEXT }}</p>
        <p>
        <a href="{$unsubscribe}" style="color: #777777; text-decoration: underline;">
            {{ UNSUBSCRIBE_TEXT }}
        </a>
    </p>
</div>
    </div>
</body>
</html>
